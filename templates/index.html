<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipForge - AI Shorts</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#09090f;
    color:#fff;
}

.container{
    max-width:700px;
    margin:auto;
    padding:30px 18px;
}

.logo{
    text-align:center;
    font-size:40px;
    font-weight:800;
}

.subtitle{
    text-align:center;
    color:#999;
    margin:8px 0 28px;
}

.card{
    background:#15151f;
    border:1px solid #292936;
    border-radius:20px;
    padding:22px;
}

label{
    display:block;
    margin:18px 0 8px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #333;
    background:#0d0d14;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    margin-top:24px;
    padding:16px;
    border:0;
    border-radius:12px;
    background:#ff3158;
    color:white;
    font-size:17px;
    font-weight:bold;
}

button:disabled{
    opacity:.5;
}

#status{
    text-align:center;
    margin-top:20px;
    color:#aaa;
}

.clip{
    margin-top:25px;
    padding:15px;
    background:#101018;
    border-radius:15px;
}

video{
    width:100%;
    border-radius:12px;
    background:#000;
}

.download{
    display:block;
    text-align:center;
    text-decoration:none;
    color:#fff;
    background:#252535;
    padding:13px;
    margin-top:10px;
    border-radius:10px;
}

.info{
    color:#777;
    font-size:12px;
    line-height:1.5;
    margin-top:18px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">ClipForge ✂️</div>

    <div class="subtitle">
        Turn your videos into Shorts
    </div>

    <div class="card">

        <label>Video Upload</label>

        <input
            id="video"
            type="file"
            accept="video/*"
        >

        <label>Number of Shorts</label>

        <select id="clips">
            <option value="1">1 Short</option>
            <option value="2">2 Shorts</option>
            <option value="3" selected>3 Shorts</option>
            <option value="4">4 Shorts</option>
            <option value="5">5 Shorts</option>
        </select>

        <label>Short Length</label>

        <select id="length">
            <option value="15">15 Seconds</option>
            <option value="30" selected>30 Seconds</option>
            <option value="45">45 Seconds</option>
            <option value="60">60 Seconds</option>
        </select>

        <label>Style</label>

        <select id="style">
            <option value="viral">Viral</option>
            <option value="cinematic">Cinematic</option>
            <option value="news">News</option>
            <option value="bright">Bright</option>
        </select>

        <button
            id="generate"
            onclick="generateClips()">
            ✂️ Generate Shorts
        </button>

        <div id="status"></div>

        <div id="results"></div>

        <div class="info">
            अभी यह version video को 9:16 Shorts में convert करता है।
            Auto captions और AI highlight selection अगला backend upgrade है।
            केवल उन्हीं videos का इस्तेमाल करें जिनके उपयोग की आपको अनुमति है।
        </div>

    </div>

</div>

<script>

async function generateClips(){

    const video =
        document.getElementById("video").files[0];

    const clips =
        document.getElementById("clips").value;

    const length =
        document.getElementById("length").value;

    const style =
        document.getElementById("style").value;

    const status =
        document.getElementById("status");

    const results =
        document.getElementById("results");

    const button =
        document.getElementById("generate");

    if(!video){

        status.innerText =
            "पहले video select करें।";

        return;
    }

    button.disabled = true;

    button.innerText =
        "⏳ Processing...";

    status.innerText =
        "Shorts बन रहे हैं...";

    results.innerHTML = "";

    const form =
        new FormData();

    form.append(
        "video",
        video
    );

    form.append(
        "clips",
        clips
    );

    form.append(
        "length",
        length
    );

    form.append(
        "style",
        style
    );

    try{

        const response =
            await fetch(
                "/api/process",
                {
                    method:"POST",
                    body:form
                }
            );

        const text =
            await response.text();

        let data;

        try{

            data =
                JSON.parse(text);

        }catch(e){

            throw new Error(
                "Server ने valid response नहीं दिया।"
            );
        }

        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.error ||
                "Processing failed."
            );
        }

        status.innerText =
            data.message;

        data.clips.forEach(
            (clip,index)=>{

                const box =
                    document.createElement(
                        "div"
                    );

                box.className =
                    "clip";

                box.innerHTML = `
                    <h3>
                        Short ${index+1}
                    </h3>

                    <video
                        controls
                        playsinline
                        src="${clip.url}">
                    </video>

                    <a
                        class="download"
                        href="${clip.url}"
                        download>
                        ⬇️ Download Short
                    </a>
                `;

                results.appendChild(box);

            }
        );

    }catch(error){

        status.innerText =
            "Error: " +
            error.message;

    }finally{

        button.disabled =
            false;

        button.innerText =
            "✂️ Generate Shorts";
    }
}

</script>

</body>
</html>
