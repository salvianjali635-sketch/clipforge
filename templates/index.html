<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipForge - YouTube Clips</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b0b12;
    color:white;
}
.container{
    max-width:700px;
    margin:auto;
    padding:35px 18px;
}
.logo{
    text-align:center;
    font-size:38px;
    font-weight:800;
    margin-bottom:8px;
}
.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:30px;
}
.card{
    background:#15151f;
    border:1px solid #292936;
    border-radius:20px;
    padding:22px;
}
label{
    display:block;
    margin:15px 0 8px;
    font-weight:bold;
}
input,select{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #333;
    background:#0d0d14;
    color:white;
    font-size:16px;
}
button{
    width:100%;
    margin-top:22px;
    padding:16px;
    border:0;
    border-radius:12px;
    background:#ff3158;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}
button:disabled{
    opacity:.5;
}
#status{
    margin-top:20px;
    text-align:center;
    color:#aaa;
}
.clip{
    margin-top:25px;
    padding:15px;
    background:#11111a;
    border-radius:15px;
}
video{
    width:100%;
    max-height:600px;
    border-radius:12px;
    background:black;
}
.download{
    display:block;
    text-align:center;
    text-decoration:none;
    color:white;
    background:#242432;
    padding:13px;
    margin-top:10px;
    border-radius:10px;
}
.note{
    font-size:12px;
    color:#777;
    margin-top:18px;
    line-height:1.5;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">ClipForge ✂️</div>

    <div class="subtitle">
        YouTube video se Shorts / Reels clips
    </div>

    <div class="card">

        <label>YouTube Video Link</label>

        <input
            id="url"
            type="url"
            placeholder="https://www.youtube.com/watch?v=..."
        >

        <label>Clip Style</label>

        <select id="style">
            <option value="viral">Viral</option>
            <option value="cinematic">Cinematic</option>
            <option value="news">News</option>
            <option value="bright">Bright</option>
        </select>

        <label>Number of Clips</label>

        <select id="clips">
            <option value="1">1 Clip</option>
            <option value="2">2 Clips</option>
            <option value="3" selected>3 Clips</option>
            <option value="4">4 Clips</option>
            <option value="5">5 Clips</option>
        </select>

        <label>Clip Length</label>

        <select id="length">
            <option value="15">15 Seconds</option>
            <option value="30" selected>30 Seconds</option>
            <option value="45">45 Seconds</option>
            <option value="60">60 Seconds</option>
        </select>

        <button id="generate" onclick="generateClips()">
            ✂️ Generate Clips
        </button>

        <div id="status"></div>

        <div id="results"></div>

        <div class="note">
            केवल ऐसे YouTube वीडियो इस्तेमाल करें जिन्हें डाउनलोड और
            इस्तेमाल करने की आपको अनुमति है।
        </div>

    </div>

</div>

<script>

async function generateClips(){

    const url = document.getElementById("url").value.trim();
    const style = document.getElementById("style").value;
    const clips = document.getElementById("clips").value;
    const length = document.getElementById("length").value;

    const status = document.getElementById("status");
    const results = document.getElementById("results");
    const button = document.getElementById("generate");

    if(!url){
        status.innerText = "पहले YouTube link डालें।";
        return;
    }

    button.disabled = true;
    button.innerText = "⏳ Processing...";
    status.innerText = "YouTube video process हो रहा है...";
    results.innerHTML = "";

    const form = new FormData();

    form.append("url", url);
    form.append("style", style);
    form.append("clips", clips);
    form.append("length", length);

    try{

        const response = await fetch("/api/process", {
            method:"POST",
            body:form
        });

        const text = await response.text();

        let data;

        try{
            data = JSON.parse(text);
        }catch(e){
            throw new Error(
                "Server ने valid JSON response नहीं दिया। Render Logs check करें।"
            );
        }

        if(!response.ok || !data.success){
            throw new Error(data.error || "Processing failed.");
        }

        status.innerText = data.message;

        data.clips.forEach((clip, index) => {

            const div = document.createElement("div");
            div.className = "clip";

            div.innerHTML = `
                <h3>Clip ${index + 1}</h3>

                <video
                    controls
                    playsinline
                    src="${clip.url}">
                </video>

                <a
                    class="download"
                    href="${clip.url}"
                    download>
                    ⬇️ Download Clip
                </a>
            `;

            results.appendChild(div);
        });

    }catch(error){

        status.innerText = "Error: " + error.message;

    }finally{

        button.disabled = false;
        button.innerText = "✂️ Generate Clips";

    }
}

</script>

</body>
</html>
